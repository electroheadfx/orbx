# Tests d'Orbx sur macOS et Windows, à chaque envoi.
# Sous Windows s'ajoutent la fabrication de l'application, sa vérification
# (fusibles, icône, informations de version, inscription comme navigateur) et
# des captures d'écran, publiées comme pièces jointes de l'exécution.
name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bloqueur de publicités
        run: node tests/adblock.test.js

      - name: Extensions
        run: node --test tests/extensions.test.js

      - name: Icônes
        run: node --test tests/icons.test.js

      # L'écran par défaut des machines Windows est trop petit pour la fenêtre.
      - name: Écran en 1920 × 1080 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Dossier des captures, version
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          echo "ORBX_SHOTS=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"
          echo "ORBX_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Tests de bout en bout
        run: node scripts/dev.js --selftest

      # Couche d'API des extensions, dans le vrai navigateur, sans réseau.
      - name: Extensions dans le navigateur
        run: node scripts/test-ext.js

      # Après les tests de bout en bout : sous Windows, le moteur installé
      # (electron.exe) sert d'exécutable d'essai. Ailleurs, ces essais sont sautés.
      - name: Fabrication pour Windows (fusibles, ressources de l'exécutable, registre)
        run: node --test tests/pe-resources.test.js

      - name: Fabrication de l'application (Windows)
        if: runner.os == 'Windows'
        run: node scripts/build-win.js --icon

      - name: L'application fabriquée démarre (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ORBX_SCENARIO=tests/smoke.js ORBX_USER_DATA="$RUNNER_TEMP/orbx-smoke" "$HOME/.orbx-dev/dist/Orbx/Orbx.exe" --selftest --orbx-test

      - name: Archive, fusibles, version et icône de Orbx.exe (Windows)
        if: runner.os == 'Windows'
        run: node tests/win-package.js

      # Relecture indépendante par PowerShell, sans passer par le code d'Orbx.
      - name: Informations de version lues par PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Item "$HOME/.orbx-dev/dist/Orbx/Orbx.exe").VersionInfo
          $v | Format-List ProductName, FileDescription, CompanyName, FileVersion, ProductVersion, OriginalFilename, InternalName, LegalCopyright
          if ($v.ProductName -ne 'Orbx' -or $v.FileDescription -ne 'Orbx' -or $v.CompanyName -ne 'Laurent Marques' -or $v.OriginalFilename -ne 'Orbx.exe') { throw 'Informations de version inattendues' }
          if ($v.FileVersion -ne $env:ORBX_VERSION -or $v.ProductVersion -ne $env:ORBX_VERSION) { throw "Version inattendue : $($v.FileVersion)" }

      - name: Navigateur par défaut — inscription (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ORBX_WIN_DEFAULT_STEP=register ORBX_SCENARIO=tests/win-default.js ORBX_USER_DATA="$RUNNER_TEMP/orbx-defaut" "$HOME/.orbx-dev/dist/Orbx/Orbx.exe" --selftest --orbx-test

      - name: Navigateur par défaut — registre relu après l'inscription (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "$HOME/.orbx-dev/dist/Orbx/Orbx.exe").Path
          reg query 'HKCU\Software\Classes\OrbxHTML' /s
          if ($LASTEXITCODE) { throw 'OrbxHTML absent' }
          reg query 'HKCU\Software\Clients\StartMenuInternet\Orbx' /s
          if ($LASTEXITCODE) { throw 'StartMenuInternet\Orbx absent' }
          reg query 'HKCU\Software\RegisteredApplications' /v Orbx
          if ($LASTEXITCODE) { throw 'Orbx absent de RegisteredApplications' }
          # Liste des applications inscrites : Orbx y figure, et son chemin mène à des capacités lisibles.
          $apps = Get-ItemProperty 'HKCU:\Software\RegisteredApplications'
          Write-Host "Applications inscrites pour l'utilisateur : $(($apps.PSObject.Properties | Where-Object { $_.Name -notlike 'PS*' } | ForEach-Object Name) -join ', ')"
          $caps = "HKCU:\$($apps.Orbx)"
          if ((Get-ItemProperty $caps).ApplicationName -ne 'Orbx') { throw 'Capacités illisibles' }
          if ((Get-ItemProperty $caps).ApplicationDescription -notmatch 'français') { throw 'Description mal encodée' }
          foreach ($scheme in 'http', 'https') { if ((Get-ItemProperty "$caps\URLAssociations").$scheme -ne 'OrbxHTML') { throw "Capacité $scheme absente" } }
          foreach ($ext in '.htm', '.html') { if ((Get-ItemProperty "$caps\FileAssociations").$ext -ne 'OrbxHTML') { throw "Capacité $ext absente" } }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\OrbxHTML\shell\open\command').'(default)'
          if ($cmd -ne "`"$exe`" `"%1`"") { throw "Commande inattendue : $cmd" }
          Write-Host "Commande d'ouverture : $cmd"

      - name: Navigateur par défaut — retrait (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ORBX_WIN_DEFAULT_STEP=unregister ORBX_SCENARIO=tests/win-default.js ORBX_USER_DATA="$RUNNER_TEMP/orbx-defaut" "$HOME/.orbx-dev/dist/Orbx/Orbx.exe" --selftest --orbx-test

      - name: Navigateur par défaut — registre relu après le retrait (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($key in 'HKCU:\Software\Classes\OrbxHTML', 'HKCU:\Software\Clients\StartMenuInternet\Orbx') { if (Test-Path $key) { throw "Clé encore présente : $key" } }
          $apps = Get-ItemProperty 'HKCU:\Software\RegisteredApplications'
          if ($null -ne $apps.Orbx) { throw 'Orbx encore dans RegisteredApplications' }
          foreach ($ext in '.htm', '.html') {
            $p = Get-ItemProperty "HKCU:\Software\Classes\$ext\OpenWithProgids" -ErrorAction SilentlyContinue
            if ($p -and ($p.PSObject.Properties.Name -contains 'OrbxHTML')) { throw "OrbxHTML encore proposé pour $ext" }
          }
          Write-Host 'Plus aucune trace de l''inscription dans le registre.'

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

      - name: Application Windows (zip)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Orbx-${{ env.ORBX_VERSION }}-windows-x64
          path: ~/.orbx-dev/dist/Orbx-${{ env.ORBX_VERSION }}-windows-x64.zip
          compression-level: 0
